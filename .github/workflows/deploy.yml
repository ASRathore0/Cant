name: Deploy Cant to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies & Build React
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          # Copy built React assets directly into backend/public for single-domain routing
          cp -r frontend/dist/* backend/public/

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: 📦 Install Composer Production Dependencies
        run: |
          cd backend
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          cd ..

      - name: 📁 Prepare Storage Directories
        run: |
          mkdir -p backend/storage/framework/cache/data
          mkdir -p backend/storage/framework/sessions
          mkdir -p backend/storage/framework/views
          mkdir -p backend/storage/logs
          mkdir -p backend/bootstrap/cache

      - name: 🚀 Deploy to Hostinger via Rsync over SSH
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_REMOTE_PATH || 'public_html/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync
          TARGET_DIR="${REMOTE_PATH%/}/"
          sshpass -p "$SSH_PASS" rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p $SSH_PORT" \
            --exclude '.git*' \
            --exclude '.github*' \
            --exclude '**/node_modules/**' \
            --exclude 'backend/tests/**' \
            --exclude 'backend/.env' \
            --exclude 'backend/storage/logs/*.log' \
            ./ "$SSH_USER@$SSH_HOST:$TARGET_DIR"

      - name: ⚡ Run Migrations & Cache Optimization
        uses: appleboy/ssh-action@master
        continue-on-error: true
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            TARGET="${{ secrets.HOSTINGER_REMOTE_PATH || 'public_html' }}"
            cd "$TARGET/backend" || cd ~/public_html/backend
            if [ -f .env ]; then
              php artisan migrate --force
              php artisan storage:link || true
              php artisan optimize:clear
              echo "✅ Auto-migration and cache clearance completed successfully!"
            else
              echo "⚠️ backend/.env not found yet. Please create backend/.env to complete database connection."
            fi
